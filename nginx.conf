events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Uploaded clips (Recorded Playback) can be up to 500 MB.
    client_max_body_size 500m;

    server {
        listen 80;
        server_name _;

        # Route WebSocket traffic to the Python Live Server. /ws-test/ is the admin-only
        # box-vs-segmentation shadow comparison view (see websocket_test_endpoint in
        # live_server.py) - a regex so one block covers both prefixes.
        location ~ ^/(ws|ws-test)/ {
            proxy_pass http://python-server:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;   # a camera socket stays open for as long as the page does
            proxy_send_timeout 3600s;
        }

        # Python-served REST endpoints (the Node server doesn't implement these).
        # process_recorded runs the whole video before answering, so allow a long wait.
        location ~ ^/api/(process_recorded|admin/login|admin/logout|violations/[0-9]+)$ {
            proxy_pass http://python-server:8000;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Images and videos the Python server writes at runtime (Vite proxies these in dev)
        location ~ ^/(evidence_snapshots|recorded_videos|calibration_results)/ {
            proxy_pass http://python-server:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Plan-B replay clips (public/demo on the host, mounted read-only). nginx serves them
        # itself, including the Range requests video playback needs.
        location /demo/ {
            alias /srv/demo/;
            add_header Cache-Control "public, max-age=3600";
        }

        # Route all other traffic to the Node Server (which also serves the Vite frontend)
        location / {
            proxy_pass http://node-server:3001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
