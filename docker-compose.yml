version: '3.8'

services:
  node-server:
    build: .
    image: section35-app
    container_name: section35-node
    command: npm start
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PASSWORD=password
    depends_on:
      - db

  python-server:
    build: .
    image: section35-app
    container_name: section35-python
    command: python scripts/live_server.py
    restart: unless-stopped
    depends_on:
      - node-server
      - db
    # Model is pre-downloaded, but we don't need volumes for the live server unless it saves data.
    # We share the same image so it has all the dependencies.
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PASSWORD=password

  nginx:
    image: nginx:alpine
    container_name: section35-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-server
      - python-server

  db:
    image: mysql:8.0
    container_name: section35-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: section35_db
    volumes:
      - db_data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    ports:
      - "3306:3306"

volumes:
  db_data:
